name: Release VPM Package

# Cut a release by bumping "version" in Packages/dev.avatarvcs.avatar-vcs/package.json
# on main, then: git tag v<version> && git push origin v<version>
on:
  push:
    tags:
      - "v*"

env:
  PACKAGE_ID: dev.avatarvcs.avatar-vcs
  PACKAGE_DIR: Packages/dev.avatarvcs.avatar-vcs

jobs:
  release:
    runs-on: ubuntu-latest
    # Scoped to this job rather than the whole workflow. contents: write is
    # genuinely needed twice here -- to push the index.json update back to
    # main, and to create the GitHub Release -- but nothing else in this
    # repo's automation should inherit it by default.
    permissions:
      contents: write
    steps:
      - name: Checkout the pushed tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The commit the tag points at, not main's HEAD -- otherwise a tag
          # that doesn't sit on main's tip would ship an artifact whose
          # contents don't match its name. The version check below guards it.
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Read package version
        id: package
        run: |
          version=$(python3 -c "import json; print(json.load(open('${{ env.PACKAGE_DIR }}/package.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches the checked-out package.json version
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$PACKAGE_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION} at that tag."
            exit 1
          fi

      - name: Build package zip
        id: zip
        env:
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          zip_name="${{ env.PACKAGE_ID }}-${PACKAGE_VERSION}.zip"
          (cd "${{ env.PACKAGE_DIR }}" && zip -r "$OLDPWD/${zip_name}" .)
          sha256=$(sha256sum "${zip_name}" | cut -d ' ' -f1)
          echo "zip_name=${zip_name}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}" >> "$GITHUB_OUTPUT"

      # The zip was built from the tag's tree (above). The VPM index lives on
      # main, so update and push THAT -- keep the tag's package.json aside and
      # apply its entry onto main's index.json. Never push the tag's tree to
      # main (a tag off main's tip would rewrite it).
      - name: Stash the tag's package.json
        run: cp "${{ env.PACKAGE_DIR }}/package.json" "${RUNNER_TEMP}/tagged-package.json"

      - name: Switch to main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Update main's index.json with this version's entry
        env:
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.zip.outputs.zip_name }}
        run: |
          python3 .github/scripts/update_index_json.py \
            "${RUNNER_TEMP}/tagged-package.json" \
            "index.json" \
            "$RELEASE_URL" \
            "${{ steps.zip.outputs.sha256 }}"

      - name: Commit updated index.json to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "index.json already up to date; nothing to commit."
          else
            git commit -m "chore: publish ${GITHUB_REF_NAME} to VPM repo [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.zip.outputs.zip_name }}
          generate_release_notes: true
