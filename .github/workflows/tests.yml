name: Unity Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: TestProject/Library
          # Bump the cache epoch (v2) whenever files are moved/renamed under
          # Packages/**: a restored Library carries Unity's Bee build graph,
          # which keeps referencing a source file at its old path after a
          # rename and fails the compile with CS2001. A fresh epoch forces a
          # clean Library once; incremental caching resumes from there.
          key: Library-TestProject-v2-${{ hashFiles('Packages/dev.avatarvcs.avatar-vcs/**') }}
          restore-keys: |
            Library-TestProject-v2-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TestProject
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && steps.tests.outputs.artifactsPath != ''
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
