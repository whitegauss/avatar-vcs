name: Unity Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A restored Library carries Unity's Bee build graph, which is keyed to
      # the set of source files that existed when it was written. Restore one
      # across an add/rename/delete and the compile fails on files the graph
      # has never heard of -- CS2001 for a renamed file, CS0103 for every
      # consumer of a newly added type. Both have bitten this repo.
      #
      # So the cache key has two parts. The file LIST decides what may be
      # restored at all; file CONTENTS decide whether it is an exact hit.
      # Editing existing files restores the cache and builds incrementally;
      # adding, moving or deleting one misses every restore-key and builds a
      # clean Library, which is the only safe answer.
      - name: Fingerprint the package file list
        run: |
          git ls-files 'Packages/dev.avatarvcs.avatar-vcs/**' | sort > .package-file-list
          wc -l < .package-file-list

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: TestProject/Library
          key: Library-TestProject-v3-${{ hashFiles('.package-file-list') }}-${{ hashFiles('Packages/dev.avatarvcs.avatar-vcs/**') }}
          restore-keys: |
            Library-TestProject-v3-${{ hashFiles('.package-file-list') }}-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: TestProject
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always() && steps.tests.outputs.artifactsPath != ''
        with:
          name: editmode-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
